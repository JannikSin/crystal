<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Crystal</title>
<!-- Everything the app loads is its own file; the only outbound connection is
     the private Worker. No inline script (the SW registers from app.js), no
     remote anything, no base tag hijack. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' https://crystal-brief.janniksin.workers.dev; img-src 'self' data:; style-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="theme-color" content="#f3f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121118" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="stylesheet" href="./app.css">
<link rel="icon" type="image/png" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body>
<div class="wrap" id="root"></div>
<nav id="tabbar" aria-label="Sections" hidden>
  <button type="button" data-tab="today" aria-current="false">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v18"/><circle cx="12" cy="8" r="2.2"/><circle cx="12" cy="16" r="2.2"/><path d="M14.2 8H20M4 16h5.8"/></svg>
    Today</button>
  <button type="button" data-tab="news" aria-current="false">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="15" rx="2"/><path d="M7 9h6M7 12.5h10M7 16h10M16.5 9H17"/></svg>
    News</button>
  <button type="button" data-tab="markets" aria-current="false">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 20h18"/><path d="M4 16l4.5-5.5 3.5 3L19 5"/><path d="M15.5 5H19v3.5"/></svg>
    Markets</button>
  <button type="button" data-tab="money" aria-current="false">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 7.4 5"/><path d="M12 12l3.2-3.8"/><circle cx="12" cy="12" r="1" fill="currentColor"/></svg>
    Money</button>
  <button type="button" data-tab="career" aria-current="false">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6.5" width="18" height="13" rx="2"/><path d="M9 6.5V5a1.5 1.5 0 0 1 1.5-1.5h3A1.5 1.5 0 0 1 15 5v1.5"/><path d="M3 12h18"/></svg>
    Career</button>
  <button type="button" data-tab="shopping" aria-current="false">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5h2.2l2.3 10.5a1.5 1.5 0 0 0 1.5 1.2h7.6a1.5 1.5 0 0 0 1.5-1.2L20 8H6.2"/><circle cx="10" cy="20" r="1.2"/><circle cx="17" cy="20" r="1.2"/></svg>
    Shop</button>
  <button type="button" data-tab="library" aria-current="false">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5A1.5 1.5 0 0 1 5.5 4H10v16H5.5A1.5 1.5 0 0 1 4 18.5z"/><path d="M10 4h4.5A1.5 1.5 0 0 1 16 5.5v13a1.5 1.5 0 0 1-1.5 1.5H10"/><path d="M17.5 6l2.6 12.2"/></svg>
    Library</button>
  <button type="button" data-tab="listen" aria-current="false">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 14v-2a8 8 0 0 1 16 0v2"/><rect x="2.5" y="13.5" width="4.5" height="7" rx="2"/><rect x="17" y="13.5" width="4.5" height="7" rx="2"/></svg>
    Listen</button>
</nav>
<script type="module" src="./app.js"></script>
</body>
</html>
