<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Crystal</title>
<meta name="theme-color" content="#f3f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121118" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
/* Crystal: the morning paper of one, grown into a full paper.
   Four sections behind one masthead: Today (the front page), News (the
   dispatch), Markets (the evening edition), Money (the ledger).
   New York serif mastheads, SF Mono instruments, violet dawn and brass. */
:root{
  color-scheme: light dark;
  --serif: ui-serif, "New York", Georgia, "Times New Roman", serif;
  --sans: -apple-system, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
  --bg:#f3f2f7; --card:#fffefd; --edge:#e4e2ea; --hairline:#ecebf1;
  --ink:#211f2a; --dim:#6d6980; --faint:#9894a8;
  --accent:#5646c4; --accent-ink:#4a3cae; --gold:#c98a2d;
  --soft:#efecfa; --soft-edge:#ded8f4; --press:#f7f5fd;
  --warn:#8a5a00; --warnbg:#f9efdb;
  /* direction pair, validated (dataviz six checks, light surface #fffefd):
     up #116a30 / down #ef6a4d, CVD deltaE 11.4, always paired with an arrow */
  --up:#116a30; --down:#ef6a4d;
  --upbg:#e7f2ea; --downbg:#fdeeea;
  --dawn:linear-gradient(90deg,#5646c4 0%,#8a7bf0 55%,#d9a03d 100%);
  --shadow:0 1px 2px rgba(33,31,42,.05), 0 4px 14px rgba(33,31,42,.04);
  --glass:rgba(243,242,247,.86);
}
@media(prefers-color-scheme:dark){
  :root{
    --bg:#121118; --card:#1b1a23; --edge:#2c2a38; --hairline:#242230;
    --ink:#eceaf3; --dim:#a09cb2; --faint:#767287;
    --accent:#a99bff; --accent-ink:#beb3ff; --gold:#e0b45e;
    --soft:#282542; --soft-edge:#3a3660; --press:#232030;
    --warn:#f0be69; --warnbg:#2d2312;
    /* dark pair validated vs #1b1a23: up #22883f / rose #e85d84, deltaE 10.3 */
    --up:#22883f; --down:#e85d84;
    --upbg:#182a1d; --downbg:#33202a;
    --dawn:linear-gradient(90deg,#7a68e8 0%,#a99bff 55%,#f0c070 100%);
    --shadow:0 1px 2px rgba(0,0,0,.25), 0 4px 14px rgba(0,0,0,.18);
    --glass:rgba(18,17,24,.86);
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:var(--sans);font-size:.96rem;line-height:1.55;
  color:var(--ink);background:var(--bg);
  padding:calc(12px + env(safe-area-inset-top)) 14px calc(84px + env(safe-area-inset-bottom));}
.wrap{max-width:640px;margin:0 auto}
button{font:inherit;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}

/* ---------- masthead ---------- */
header{padding:6px 2px 0}
.eyebrow{font-family:var(--mono);font-size:.68rem;letter-spacing:.24em;text-transform:uppercase;
  color:var(--accent);display:flex;align-items:center;gap:8px}
.eyebrow::after{content:"";flex:1;height:1px;background:var(--edge)}
header h1{margin:6px 0 0;font-family:var(--serif);font-weight:600;font-size:1.72rem;
  line-height:1.15;letter-spacing:-.01em}
header .strap{font-family:var(--serif);font-style:italic;color:var(--dim);
  font-size:.98rem;margin-top:4px}
.dawn{height:5px;border-radius:99px;background:var(--hairline);overflow:hidden;margin-top:14px}
.dawn i{display:block;height:100%;width:0;border-radius:99px;background:var(--dawn);
  background-size:100vw 100%;transition:width .45s cubic-bezier(.22,1,.36,1)}
.meter{font-family:var(--mono);font-size:.72rem;color:var(--dim);margin-top:7px;
  display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.meter b{color:var(--accent);font-weight:600}
#sync{color:var(--faint);text-align:right}

/* ---------- tab bar ---------- */
#tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;
  padding:7px 8px calc(7px + env(safe-area-inset-bottom));
  background:var(--glass);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
  border-top:1px solid var(--edge)}
#tabbar button{flex:1;background:none;border:none;cursor:pointer;color:var(--faint);
  font-family:var(--mono);font-size:.58rem;letter-spacing:.16em;text-transform:uppercase;
  display:flex;flex-direction:column;align-items:center;gap:3px;padding:3px 0 2px;border-radius:10px}
#tabbar button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.6;
  stroke-linecap:round;stroke-linejoin:round}
#tabbar button[aria-current="true"]{color:var(--accent)}
#tabbar button:active{background:var(--press)}

/* ---------- day switcher (Today + Markets history) ---------- */
.days{display:flex;gap:7px;margin:14px -14px 0;padding:2px 14px 6px;overflow-x:auto;
  -webkit-overflow-scrolling:touch;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.days button{flex:0 0 auto;min-width:46px;padding:6px 4px 7px;border-radius:11px;
  border:1px solid var(--edge);background:var(--card);color:var(--dim);cursor:pointer;
  font-family:var(--mono);line-height:1.25;text-align:center}
.days button .dw{display:block;font-size:.62rem;letter-spacing:.12em;text-transform:uppercase}
.days button .dn{display:block;font-size:.95rem;color:var(--ink);font-weight:500}
.days button[aria-current="true"]{background:var(--accent);border-color:var(--accent)}
.days button[aria-current="true"] .dw,.days button[aria-current="true"] .dn{color:#fff}
@media(prefers-color-scheme:dark){
  .days button[aria-current="true"] .dw,.days button[aria-current="true"] .dn{color:#16141f}
}

/* ---------- banners ---------- */
.banner{margin:12px 0 0;padding:10px 13px;border-radius:11px;background:var(--warnbg);
  color:var(--warn);font-size:.86rem}
.banner button{background:none;border:none;color:inherit;text-decoration:underline;
  cursor:pointer;padding:0;font-size:inherit}

/* ---------- scoreboard tile ---------- */
.score{background:var(--card);border:1px solid var(--edge);border-radius:14px;
  box-shadow:var(--shadow);margin:14px 0 0;padding:12px 16px 13px}
.score .eyebrow{color:var(--gold)}
.score .row{display:flex;align-items:baseline;gap:10px;margin-top:7px}
.score .num{font-family:var(--serif);font-size:1.35rem;font-weight:600;color:var(--ink);
  font-variant-numeric:tabular-nums;white-space:nowrap}
.score .lbl{font-size:.86rem;color:var(--dim);min-width:0}
.score .goal{margin-left:auto;font-family:var(--mono);font-size:.68rem;color:var(--faint);
  text-align:right;flex:0 1 auto}

/* ---------- cards ---------- */
details.card{background:var(--card);border:1px solid var(--edge);border-radius:14px;
  margin:12px 0;box-shadow:var(--shadow);overflow:hidden}
details.card>summary{list-style:none;cursor:pointer;padding:13px 16px;display:flex;gap:9px;
  align-items:baseline;-webkit-tap-highlight-color:transparent}
details.card>summary::-webkit-details-marker{display:none}
details.card>summary .t{font-family:var(--serif);font-weight:600;font-size:1.06rem;
  letter-spacing:-.005em;color:var(--ink)}
details.card>summary .n{margin-left:auto;font-family:var(--mono);font-size:.68rem;
  color:var(--faint);white-space:nowrap}
details.card>summary .n.full{color:var(--gold)}
details.card>summary::after{content:"›";color:var(--faint);font-size:1.05rem;
  transform:rotate(90deg);transition:transform .18s;margin-left:2px;flex:0 0 auto}
details[open].card>summary::after{transform:rotate(-90deg)}
details.card.done>summary .t{color:var(--dim)}
details.card.done{background:color-mix(in srgb, var(--card) 82%, var(--bg))}
.cardbody{padding:0 16px 14px;border-top:1px solid var(--hairline)}
.cardbody>:first-child{margin-top:10px}
.cardbody p{margin:.45rem 0}
.cardbody ul{margin:.45rem 0;padding-left:1.15rem}
.cardbody li{margin:.22rem 0}
.cardbody li::marker{color:var(--faint)}
.cardbody a{color:var(--accent-ink);text-decoration-color:var(--soft-edge);
  text-underline-offset:2px;word-break:break-word}
.cardbody code{font-family:var(--mono);background:var(--soft);color:var(--accent-ink);
  padding:1px 5px;border-radius:5px;font-size:.85em}
.wiki{color:var(--accent-ink);background:var(--soft);padding:1px 7px;border-radius:6px;
  font-size:.9em;white-space:nowrap}
.wiki::before{content:"◈ ";opacity:.5}

/* ---------- ticks ---------- */
label.tick{display:flex;gap:12px;align-items:flex-start;padding:9px 10px;margin:3px -10px;
  border-radius:10px;cursor:pointer;-webkit-tap-highlight-color:transparent;position:relative}
label.tick:active{background:var(--press)}
label.tick input{position:absolute;opacity:0;width:26px;height:26px;margin:0}
label.tick .box{flex:0 0 auto;width:23px;height:23px;margin-top:2px;border-radius:8px;
  border:1.5px solid var(--faint);background:transparent;position:relative;
  transition:background .18s,border-color .18s}
label.tick .box svg{position:absolute;inset:0;width:100%;height:100%;padding:4px;
  stroke:#fff;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round;
  stroke-dasharray:22;stroke-dashoffset:22}
@media(prefers-color-scheme:dark){label.tick .box svg{stroke:#16141f}}
label.tick input:checked+.box{background:var(--accent);border-color:var(--accent);
  animation:pop .3s cubic-bezier(.3,1.6,.5,1)}
label.tick input:checked+.box svg{stroke-dashoffset:0;transition:stroke-dashoffset .22s ease .06s}
label.tick input:focus-visible+.box{outline:2px solid var(--accent);outline-offset:2px}
@keyframes pop{0%{transform:scale(.82)}55%{transform:scale(1.12)}100%{transform:scale(1)}}
label.tick .txt{min-width:0;background-image:linear-gradient(currentColor,currentColor);
  background-repeat:no-repeat;background-size:0% 1.5px;background-position:0 68%;
  transition:background-size .3s ease,opacity .2s}
label.tick.done .txt{opacity:.45;background-size:100% 1.5px}
label.cardtick{display:inline-flex;background:var(--soft);border:1px solid var(--soft-edge);
  margin:4px 0 8px;padding:8px 13px 8px 10px;font-size:.9em;font-weight:600;
  color:var(--accent-ink);border-radius:11px}
label.cardtick:active{background:var(--soft)}

/* ---------- capture ---------- */
.capture{background:var(--card);border:1px solid var(--edge);border-radius:14px;
  box-shadow:var(--shadow);margin:18px 0 0;padding:13px 16px 14px}
.capture h2{margin:0;font-family:var(--serif);font-weight:600;font-size:1.06rem}
.capture .hint{color:var(--dim);font-size:.82rem;margin:2px 0 9px}
.capture textarea{display:block;width:100%;min-height:64px;resize:vertical;font:inherit;
  font-size:16px;color:var(--ink);background:var(--bg);
  border:1px solid var(--edge);border-radius:11px;padding:10px 12px}
.capture textarea:focus{outline:none;border-color:var(--accent)}
.capture .row{display:flex;align-items:center;gap:10px;margin-top:9px}
.capture .send{margin-left:auto;background:var(--accent);color:#fff;border:none;
  border-radius:10px;padding:8px 18px;font-weight:600;cursor:pointer}
.capture .send:active{transform:scale(.97)}
.capture .send[disabled]{opacity:.45;cursor:default}
@media(prefers-color-scheme:dark){.capture .send{color:#16141f}}
.capture .stat{font-family:var(--mono);font-size:.7rem;color:var(--faint)}
.caplist{margin:10px 0 0;padding:0;list-style:none}
.caplist li{font-size:.84rem;color:var(--dim);padding:5px 0;border-top:1px solid var(--hairline);
  display:flex;gap:8px;align-items:baseline}
.caplist .at{font-family:var(--mono);font-size:.68rem;color:var(--faint);flex:0 0 auto}

/* ---------- news: the dispatch ---------- */
.fp{padding:13px 2px 14px;border-bottom:1px solid var(--hairline);cursor:pointer;
  -webkit-tap-highlight-color:transparent}
.fp:active{background:var(--press)}
.fp .cat{font-family:var(--mono);font-size:.62rem;letter-spacing:.18em;text-transform:uppercase;
  color:var(--accent);display:flex;gap:8px;align-items:center}
.fp .cat .rmark{margin-left:auto;color:var(--faint);letter-spacing:0;font-size:.72rem}
.fp h3{margin:5px 0 0;font-family:var(--serif);font-weight:600;font-size:1.13rem;
  line-height:1.3;letter-spacing:-.005em}
.fp .one{margin:3px 0 0;color:var(--dim);font-size:.88rem}
.fp.read h3{color:var(--dim);font-weight:500}
.fp .chips{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.morebtn{display:block;width:100%;margin:14px 0 4px;padding:11px;border-radius:12px;
  border:1px solid var(--edge);background:var(--card);color:var(--accent-ink);cursor:pointer;
  font-family:var(--serif);font-style:italic;font-size:.98rem;box-shadow:var(--shadow)}
.morebtn:active{background:var(--press)}
.notshown{text-align:center;color:var(--faint);font-family:var(--serif);font-style:italic;
  font-size:.88rem;margin:12px 0 0}
.batchrule{display:flex;align-items:center;gap:10px;margin:16px 0 2px;
  font-family:var(--mono);font-size:.62rem;letter-spacing:.2em;text-transform:uppercase;
  color:var(--faint)}
.batchrule::before,.batchrule::after{content:"";flex:1;height:1px;background:var(--edge)}

/* story page */
.backbtn{background:none;border:none;color:var(--accent-ink);cursor:pointer;padding:6px 0;
  font-family:var(--mono);font-size:.74rem;letter-spacing:.1em;text-transform:uppercase}
.art h2{font-family:var(--serif);font-weight:600;font-size:1.45rem;line-height:1.22;
  letter-spacing:-.01em;margin:8px 0 4px}
.art .one{color:var(--dim);font-family:var(--serif);font-style:italic;margin:0 0 6px}
.art h4{font-family:var(--mono);font-size:.64rem;letter-spacing:.2em;text-transform:uppercase;
  color:var(--faint);margin:18px 0 6px}
.art ul{margin:.35rem 0;padding-left:1.1rem}
.art li{margin:.3rem 0}
.art li::marker{color:var(--faint)}
.why{background:var(--soft);border-left:3px solid var(--accent);border-radius:0 11px 11px 0;
  padding:10px 13px;margin:8px 0;font-size:.92rem}
.srcpanel{background:var(--card);border:1px solid var(--edge);border-radius:13px;
  box-shadow:var(--shadow);padding:12px 15px;margin:10px 0}
.srcpanel .src{display:flex;gap:8px;align-items:baseline;padding:4px 0;
  border-top:1px solid var(--hairline);font-size:.88rem}
.srcpanel .src:first-of-type{border-top:none}
.srcpanel .src b{font-weight:600;flex:0 0 auto}
.srcpanel .src span{color:var(--dim)}
.badge{display:inline-block;font-family:var(--mono);font-size:.64rem;letter-spacing:.06em;
  padding:2px 8px;border-radius:99px;border:1px solid var(--edge);color:var(--dim);
  background:var(--bg);white-space:nowrap}
.badge.gold{color:var(--gold);border-color:color-mix(in srgb, var(--gold) 40%, var(--edge))}
.badge.violet{color:var(--accent-ink);border-color:var(--soft-edge);background:var(--soft)}
.badge.up{color:var(--up);border-color:color-mix(in srgb, var(--up) 35%, var(--edge));background:var(--upbg)}
.badge.down{color:var(--down);border-color:color-mix(in srgb, var(--down) 35%, var(--edge));background:var(--downbg)}

/* score chip + subscores */
.scorechip{display:inline-flex;align-items:baseline;gap:7px;border:1px solid var(--soft-edge);
  background:var(--soft);color:var(--accent-ink);border-radius:99px;padding:5px 14px;
  cursor:pointer;font-family:var(--mono)}
.scorechip .v{font-size:1.05rem;font-weight:700}
.scorechip .cap{font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;opacity:.75}
.subscores{background:var(--card);border:1px solid var(--edge);border-radius:13px;
  box-shadow:var(--shadow);padding:12px 15px;margin:10px 0}
.subscores .sub{margin:8px 0}
.subscores .subhead{display:flex;justify-content:space-between;align-items:baseline;
  font-family:var(--mono);font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.subscores .subhead b{font-size:.9rem;color:var(--ink)}
.subscores .bar{height:5px;border-radius:99px;background:var(--hairline);margin-top:4px;overflow:hidden}
.subscores .bar i{display:block;height:100%;border-radius:99px}
.subscores .bar.rel i{background:var(--accent)}
.subscores .bar.chg i{background:var(--gold)}
.subscores .reason{font-size:.88rem;color:var(--dim);margin-top:9px}
.aiest{font-family:var(--mono);font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;
  color:var(--faint);margin-top:8px}
.contested{background:var(--warnbg);border-radius:11px;padding:11px 14px;margin:10px 0;
  font-size:.9rem;color:var(--warn)}
.contested h5{margin:0 0 4px;font-family:var(--mono);font-size:.64rem;letter-spacing:.18em;
  text-transform:uppercase}
.contested ul{margin:.3rem 0 0;padding-left:1.1rem}

/* ---------- money: the ledger ---------- */
.pf{background:var(--card);border:1px solid var(--edge);border-radius:14px;
  box-shadow:var(--shadow);margin:14px 0 0;padding:13px 16px 14px}
.pf .eyebrow{color:var(--gold)}
.pf .total{font-family:var(--serif);font-weight:600;font-size:2rem;letter-spacing:-.01em;
  font-variant-numeric:tabular-nums;margin-top:6px}
.pf .subrow{display:flex;flex-wrap:wrap;gap:4px 16px;margin-top:4px;
  font-family:var(--mono);font-size:.74rem;color:var(--dim)}
.delta{font-variant-numeric:tabular-nums;white-space:nowrap}
.delta.up{color:var(--up)}
.delta.down{color:var(--down)}
.seg{display:flex;gap:4px;background:var(--hairline);border-radius:11px;padding:3px;margin:14px 0 0}
.seg button{flex:1;border:none;background:none;border-radius:9px;padding:6px 0;cursor:pointer;
  font-family:var(--mono);font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.seg button[aria-current="true"]{background:var(--card);color:var(--accent-ink);box-shadow:var(--shadow)}
.dialgrid{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:12px}
.dial{background:var(--card);border:1px solid var(--edge);border-radius:14px;
  box-shadow:var(--shadow);padding:12px 12px 11px;cursor:pointer;text-align:center;
  -webkit-tap-highlight-color:transparent}
.dial:active{background:var(--press)}
.dial svg{display:block;margin:0 auto}
.dial .tk{font-family:var(--mono);font-size:.78rem;letter-spacing:.1em;color:var(--ink);
  font-weight:600;margin-top:6px}
.dial .val{font-family:var(--serif);font-weight:600;font-size:1.18rem;
  font-variant-numeric:tabular-nums}
.dial .sub{font-family:var(--mono);font-size:.66rem;color:var(--faint);margin-top:1px}
.dial .d{font-family:var(--mono);font-size:.74rem;margin-top:3px}
.dial .ltcg{margin-top:7px}
.gaugehint{font-family:var(--mono);font-size:.62rem;color:var(--faint);text-align:right;margin-top:8px}
.cashsec{margin-top:16px}
.cashsec .cashrow{display:flex;gap:10px;align-items:baseline;background:var(--card);
  border:1px solid var(--edge);border-radius:12px;padding:10px 14px;margin-top:8px;
  box-shadow:var(--shadow)}
.cashsec .cashrow b{font-family:var(--mono);font-size:.82rem}
.cashsec .cashrow .amt{font-family:var(--serif);font-weight:600;font-variant-numeric:tabular-nums}
.cashsec .cashrow .em{color:var(--dim);font-size:.82rem;margin-left:auto;text-align:right}
.moneyfoot{text-align:center;color:var(--faint);font-size:.76rem;margin-top:20px;
  font-family:var(--serif);font-style:italic}

/* money detail */
.det .tkhead{display:flex;align-items:baseline;gap:10px;margin-top:6px}
.det .tkhead h2{margin:0;font-family:var(--serif);font-weight:600;font-size:1.6rem}
.det .tkhead .px{font-family:var(--serif);font-size:1.3rem;font-variant-numeric:tabular-nums;
  margin-left:auto}
.det h4{font-family:var(--mono);font-size:.64rem;letter-spacing:.2em;text-transform:uppercase;
  color:var(--faint);margin:20px 0 7px}
.chartcard{background:var(--card);border:1px solid var(--edge);border-radius:14px;
  box-shadow:var(--shadow);padding:12px 10px 8px;margin-top:10px}
.chartcard svg{display:block;width:100%;height:auto;touch-action:pan-y}
.chartnote{font-family:var(--mono);font-size:.66rem;color:var(--faint);
  display:flex;justify-content:space-between;padding:2px 6px 4px}
.lots{width:100%;border-collapse:collapse;font-size:.8rem;font-variant-numeric:tabular-nums}
.lots th{font-family:var(--mono);font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;
  color:var(--faint);text-align:right;padding:4px 6px;border-bottom:1px solid var(--edge);
  font-weight:500}
.lots th:first-child,.lots td:first-child{text-align:left}
.lots td{padding:6px;text-align:right;border-bottom:1px solid var(--hairline)}
.tablewrap{overflow-x:auto;margin:0 -2px}
.breaker{background:var(--card);border:1px solid var(--edge);border-radius:12px;
  padding:10px 13px;margin-top:8px;font-size:.88rem;box-shadow:var(--shadow)}
.breaker .status{font-family:var(--mono);font-size:.68rem;margin-top:3px;color:var(--dim)}
.rulelist{margin:.3rem 0;padding-left:1.1rem;font-size:.88rem;color:var(--dim)}
.eventcard{background:var(--soft);border:1px solid var(--soft-edge);border-radius:12px;
  padding:11px 14px;margin-top:8px;font-size:.9rem}
.eventcard .ed{font-family:var(--mono);font-size:.7rem;color:var(--accent-ink);
  letter-spacing:.08em;text-transform:uppercase}
.eventcard .gate{color:var(--dim);font-size:.85rem;margin-top:3px}
.newsitem{display:block;background:var(--card);border:1px solid var(--edge);border-radius:12px;
  padding:10px 13px;margin-top:8px;font-size:.88rem;box-shadow:var(--shadow);cursor:pointer}
.newsitem .cat{font-family:var(--mono);font-size:.6rem;letter-spacing:.16em;
  text-transform:uppercase;color:var(--accent)}

/* ---------- markets ---------- */
.mkt .built{font-family:var(--mono);font-size:.7rem;color:var(--faint);margin-top:6px}

/* ---------- empty, footer, key screen ---------- */
.empty{color:var(--dim);text-align:center;margin:44px 0;font-family:var(--serif);
  font-style:italic}
.emptybig{text-align:center;margin:60px 0 44px}
.emptybig .glyph{font-size:2rem}
.emptybig h3{font-family:var(--serif);font-weight:600;margin:10px 0 4px}
.emptybig p{color:var(--dim);font-size:.9rem;margin:0 auto;max-width:34ch}
footer.app{text-align:center;color:var(--faint);font-size:.8rem;margin-top:26px;
  font-family:var(--serif);font-style:italic}
footer.app .btns{margin-top:8px}
footer.app button{font-family:var(--mono);font-style:normal;font-size:.72rem;color:var(--dim);
  background:none;border:1px solid var(--edge);border-radius:9px;padding:7px 14px;
  cursor:pointer;margin:0 3px}
#keyform{max-width:420px;margin:16vh auto 0;text-align:center}
#keyform h2{font-family:var(--serif);font-size:1.45rem;margin:8px 0}
#keyform p{color:var(--dim);font-size:.9rem}
#keyform input{font:inherit;font-size:16px;width:100%;padding:12px;border-radius:11px;
  border:1px solid var(--edge);background:var(--card);color:var(--ink)}
#keyform button{margin-top:12px;background:var(--accent);color:#fff;border:none;
  border-radius:10px;padding:10px 22px;font-weight:600;cursor:pointer}
@media(prefers-color-scheme:dark){#keyform button{color:#16141f}}
#keyform .err{color:#c0392b;font-size:.86rem;min-height:1.2em;margin-top:10px}

@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
